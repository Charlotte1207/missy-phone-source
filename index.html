<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f5f5f7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="missy-phone" />
<meta name="mobile-web-app-capable" content="yes" />
<title>missy-phone</title>
<style>
:root{
  --bg:#f5f5f7;--card:#ffffff;--ink:#121212;--sub:#8a8a8e;--line:#e5e5ea;
  --glass:rgba(255,255,255,.62);--glass-strong:rgba(255,255,255,.86);
  --dark:#1c1c1e;--accent:#3a3a3c;--red:#ff3b30;--green:#34c759;--blue:#0a84ff;
  --r-lg:22px;--r-md:16px;--r-sm:10px;--shadow:0 6px 24px rgba(0,0,0,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);background:#0b0b0d;overflow:hidden;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit;outline:none}
input,textarea{border:0;background:transparent}
.app-root{height:100%;width:100%}
.perf .glass,.perf .bubble,.perf .dock,.perf .chat-head,.perf .input-bar{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.screen{height:100%;height:100dvh;width:100%;position:relative;display:flex;flex-direction:column;background:linear-gradient(180deg,#fbfbfd 0%,#eef0f4 100%);background-size:cover;background-position:center;overflow:hidden}
.status-bar{flex:0 0 34px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px;font-weight:600;color:#3a3a3c;letter-spacing:.2px}
.status-bar .right{display:flex;gap:6px;align-items:center;font-weight:500}
.status-bar .dot{width:5px;height:5px;border-radius:50%;background:#3a3a3c}
.desktop{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 12px 8px;gap:8px;position:relative;overflow:hidden}
.desk-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(0,1fr);gap:8px;transition:transform .25s ease}
.slot{position:relative;min-width:0;min-height:0;touch-action:none}
.slot.edit{animation:jiggle .28s ease-in-out infinite alternate}
@keyframes jiggle{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
.slot.dragging{opacity:0.5;transform:scale(0.95);z-index:50;pointer-events:none}
.icon-btn{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:0;background:transparent;cursor:pointer;padding:0}
.icon-core{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(180deg,#fff,#f0f0f3);box-shadow:0 3px 10px rgba(0,0,0,.07);font-weight:700;font-size:16px;color:#2c2c2e;position:relative;overflow:hidden;background-size:cover;background-position:center}
.icon-name{font-size:11px;color:#3a3a3c;font-weight:500;text-shadow:0 1px 2px rgba(255,255,255,.7)}
.delete-dot{position:absolute;right:-2px;top:-2px;width:20px;height:20px;border:0;border-radius:50%;background:var(--red);color:#fff;font-size:12px;line-height:1;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2);z-index:10}
.desk-actions{flex:0 0 30px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--sub);padding:0 4px}
.page-dot{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.18);display:inline-block;margin:0 3px}
.page-dot.on{background:#3a3a3c;width:18px;border-radius:3px}
.dock{flex:0 0 70px;border-radius:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 24px rgba(0,0,0,.06)}
.dock .icon-core{width:42px;height:42px;font-size:14px;border-radius:12px}
.dock .icon-name{display:none}
\n/* ===== 桌面编辑模式 · iOS 毛玻璃菜单 ===== */
.desktop-edit-toolbar{
  position:absolute;
  left:12px;
  right:12px;
  bottom:78px;
  z-index:35;
  display:flex;
  align-items:stretch;
  gap:8px;
  padding:8px;
  border-radius:24px;
  background:rgba(248,248,255,.68);
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  backdrop-filter:blur(26px) saturate(180%);
  border:1px solid rgba(255,255,255,.72);
  box-shadow:0 12px 34px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.52);
}
.desktop-edit-title{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:64px;
  padding:0 8px;
  font-size:12px;
  font-weight:650;
  color:#1c1c1e;
  white-space:nowrap;
}
.desktop-edit-action,
.desktop-edit-done{
  min-height:42px;
  border:1px solid rgba(255,255,255,.58);
  border-radius:16px;
  cursor:pointer;
  -webkit-backdrop-filter:blur(18px) saturate(180%);
  backdrop-filter:blur(18px) saturate(180%);
  transition:transform .16s ease, background .16s ease;
}
.desktop-edit-action{
  flex:1 1 0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:0 10px;
  background:rgba(255,255,255,.54);
  color:#1c1c1e;
  font-size:12px;
  font-weight:550;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.48);
}
.desktop-edit-done{
  flex:0 0 auto;
  padding:0 14px;
  background:rgba(28,28,30,.90);
  color:#fff;
  font-size:12px;
  font-weight:600;
  box-shadow:0 5px 12px rgba(0,0,0,.12);
}
.desktop-edit-action:active,
.desktop-edit-done:active{transform:scale(.97)}
.desktop-edit-action:hover{background:rgba(255,255,255,.72)}
.desktop-edit-done:hover{background:rgba(28,28,30,.96)}
.desktop-edit-toolbar .edit-ico{font-size:15px;line-height:1}

.desktop-widget-picker-mask{
  position:absolute;
  inset:0;
  z-index:70;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:12px;
  background:rgba(0,0,0,.18);
  -webkit-backdrop-filter:blur(5px);
  backdrop-filter:blur(5px);
}
.desktop-widget-picker{
  width:100%;
  max-height:min(74vh,640px);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border-radius:28px;
  background:rgba(248,248,252,.78);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  backdrop-filter:blur(28px) saturate(180%);
  border:1px solid rgba(255,255,255,.72);
  box-shadow:0 20px 60px rgba(0,0,0,.20), inset 0 1px 0 rgba(255,255,255,.58);
}
.desktop-widget-picker .picker-grabber{
  width:36px;
  height:4px;
  margin:8px auto 4px;
  border-radius:99px;
  background:rgba(60,60,67,.24);
}
.desktop-widget-picker .picker-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 16px 12px;
  border-bottom:1px solid rgba(60,60,67,.10);
}
.desktop-widget-picker .picker-head .title{
  font-size:16px;
  font-weight:650;
  color:#1c1c1e;
}
.desktop-widget-picker .picker-head .sub{
  font-size:11px;
  color:#8a8a8e;
  margin-top:2px;
}
.desktop-widget-picker .picker-close{
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  background:rgba(118,118,128,.12);
  color:#3a3a3c;
  display:grid;
  place-items:center;
  cursor:pointer;
  font-size:16px;
}
.desktop-widget-picker .picker-list{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:10px 12px 6px;
}
.desktop-widget-picker .picker-empty{
  padding:36px 18px;
  text-align:center;
  color:#8a8a8e;
  font-size:13px;
}
.desktop-widget-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  margin-bottom:8px;
  border:1px solid rgba(255,255,255,.60);
  border-radius:18px;
  background:rgba(255,255,255,.46);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.42);
  text-align:left;
  cursor:pointer;
}
.desktop-widget-item.selected{
  background:rgba(255,255,255,.76);
  border-color:rgba(10,132,255,.42);
  box-shadow:0 0 0 2px rgba(10,132,255,.10), inset 0 1px 0 rgba(255,255,255,.56);
}
.desktop-widget-item .pick-check{
  flex:0 0 auto;
  width:22px;
  height:22px;
  border-radius:50%;
  display:grid;
  place-items:center;
  border:1px solid rgba(60,60,67,.20);
  background:rgba(255,255,255,.44);
  color:transparent;
  font-size:12px;
  font-weight:700;
}
.desktop-widget-item.selected .pick-check{
  background:#0a84ff;
  border-color:#0a84ff;
  color:#fff;
}
.desktop-widget-preview{
  flex:0 0 64px;
  width:64px;
  height:64px;
  border-radius:15px;
  overflow:hidden;
  position:relative;
  background:rgba(255,255,255,.44);
  border:1px solid rgba(255,255,255,.62);
}
.desktop-widget-preview .widget{
  width:100%;
  height:100%;
  border-radius:0;
  box-shadow:none;
}
.desktop-widget-preview .custom-widget{
  min-height:100%;
  font-size:8px;
  padding:4px;
  pointer-events:none;
}
.desktop-widget-copy{flex:1;min-width:0}
.desktop-widget-copy .name{
  display:block;
  font-size:13px;
  font-weight:600;
  color:#1c1c1e;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.desktop-widget-copy .meta{
  display:block;
  margin-top:3px;
  font-size:10.5px;
  color:#8a8a8e;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.desktop-widget-picker .picker-foot{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 12px 12px;
  border-top:1px solid rgba(60,60,67,.10);
  background:rgba(248,248,252,.36);
}
.desktop-widget-picker .picker-foot button{
  flex:1;
  min-height:42px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.64);
  cursor:pointer;
  font-size:12.5px;
  font-weight:600;
}
.desktop-widget-picker .picker-cancel{
  background:rgba(255,255,255,.46);
  color:#3a3a3c;
}
.desktop-widget-picker .picker-add{
  background:#1c1c1e;
  color:#fff;
}
.desktop-widget-picker .picker-add:disabled{opacity:.45}
.widget{border-radius:var(--r-lg);overflow:hidden;position:relative;min-height:0;min-width:0}
.widget.glass{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow)}
.postcard{display:flex;flex-direction:column}
.postcard .cover{flex:0 0 62%;min-height:56px;background-size:cover;background-position:center;position:relative;background-color:#e8e8ec}
.postcard .cover .btn-mini{position:absolute;left:8px;top:8px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.82);border:1px solid rgba(0,0,0,.06);font-size:11px;color:#3a3a3c}
.postcard .body{flex:1;margin-top:-30px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 8px 8px;position:relative;z-index:1;overflow:hidden}
.postcard .avatar{width:56px;height:56px;border-radius:50%;border:3.5px solid #fff;background:#dcdce1 center/cover no-repeat;box-shadow:0 4px 12px rgba(0,0,0,.08);flex-shrink:0;cursor:pointer}
.postcard .nick{width:100%;text-align:center;font-size:13px;font-weight:600;line-height:1.3;padding:2px 0}
.postcard .sign{width:100%;text-align:center;font-size:11px;color:var(--sub);line-height:1.3;padding:1px 0}
.polaroid{position:relative;display:block;width:100%;height:100%;padding:0;border:0;background:transparent;cursor:pointer}
.photo-a,.photo-b{position:absolute;width:46%;aspect-ratio:85/104;border:4px solid #fff;border-radius:4px;box-shadow:0 6px 14px rgba(0,0,0,.13);background:#d9d9de center/cover no-repeat}
.photo-a{left:8%;top:12%;transform:rotate(-6deg)}
.photo-b{left:42%;top:18%;transform:rotate(7deg);background:#d9d9de center/cover no-repeat}
.custom-widget{width:100%;height:100%;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative}
.mini-chat{height:100%;padding:10px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.mini-row{display:flex;align-items:flex-start;gap:8px}
.mini-row.right{flex-direction:row-reverse}
.mini-av{width:24px;height:24px;border-radius:50%;background:#d6d6dc center/contain no-repeat;flex-shrink:0;cursor:pointer}
.mini-bub{flex:1;border-radius:14px;padding:7px 11px;font-size:11.5px;background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.04);box-shadow:0 2px 6px rgba(0,0,0,.04);min-height:28px;outline:none;color:#2c2c2e}
.music{height:100%;padding:12px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.music .title{font-size:12px;font-weight:600;border:0;background:transparent;width:100%}
.music .bar{height:5px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden}
.music .bar>div{height:100%;background:linear-gradient(90deg,#3a3a3c,#1c1c1e);border-radius:99px;transition:width .4s linear}
.music .meta{display:flex;justify-content:space-between;font-size:10px;color:var(--sub)}
.music .play{align-self:center;width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(180deg,#2c2c2e,#111);color:#fff;display:grid;place-items:center;font-size:14px;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.app-shell{flex:1;min-height:0;display:flex;flex-direction:column;background:#fbfbfd}
.app-head{flex:0 0 44px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--glass-strong);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);position:relative;z-index:5}
.app-title{position:absolute;left:50%;transform:translateX(-50%);font-size:15px;font-weight:600}
.back-btn{border:0;background:transparent;font-size:13px;color:var(--blue);padding:6px 4px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:2px}
.app-head .right-btn{margin-left:auto;border:0;background:transparent;font-size:18px;color:#3a3a3c;padding:4px 6px;cursor:pointer;line-height:1}
.app-body{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pad{padding:12px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:12px;margin-bottom:10px}
.panel h3{margin:0 0 8px;font-size:13px;font-weight:600}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.small{font-size:12px;color:var(--sub);line-height:1.6}
.btn{border:1px solid var(--line);border-radius:10px;padding:7px 12px;background:#fff;font-size:12.5px;cursor:pointer;color:#2c2c2e}
.btn:disabled{opacity:.5}
.btn.dark{background:#1c1c1e;color:#fff;border-color:#1c1c1e}
.btn.ghost{background:transparent}
.btn.block{width:100%;text-align:center}
.btn.mini{padding:4px 8px;font-size:11px;border-radius:8px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:11.5px;color:var(--sub);font-weight:500}
.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;font-size:13px;width:100%}
.field textarea{min-height:70px;resize:vertical;line-height:1.5}
.avatar{width:40px;height:40px;border-radius:50%;background:#dcdce1 center/cover no-repeat;flex-shrink:0;border:1px solid var(--line)}
.avatar.big{width:64px;height:64px}
.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.divider{height:1px;background:var(--line);margin:8px 0}
.chat-wrap{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.list-scroll{flex:1;min-height:0;overflow-y:auto;background:#fff}
.friend-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid #f2f2f5;cursor:pointer;background:#fff}
.friend-item:active{background:#f7f7fa}
.friend-item .av{width:46px;height:46px;border-radius:50%;background:#dcdce1 center/cover no-repeat;flex-shrink:0}
.friend-item .mid{flex:1;min-width:0}
.friend-item .nm{font-size:14px;font-weight:600;margin-bottom:3px}
.friend-item .ms{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.friend-item .tm{font-size:11px;color:#b0b0b6;align-self:flex-start;margin-top:4px}
.tabbar{flex:0 0 52px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--glass-strong);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tabbar button{border:0;background:transparent;font-size:12px;color:var(--sub);padding:6px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.tabbar button.on{color:#1c1c1e;font-weight:600}
.tabbar .ico{width:20px;height:20px;border-radius:6px;border:1.6px solid currentColor;opacity:.85;display:grid;place-items:center;font-size:10px;line-height:1}
.chat-page{flex:1;min-height:0;display:flex;flex-direction:column;background:#f4f4f7;position:relative}
.chat-head{flex:0 0 46px;display:flex;align-items:center;padding:0 10px;gap:8px;position:relative;background:var(--glass-strong);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);z-index:5}
.chat-exit-hit{position:absolute;left:0;top:0;width:72px;height:58px;padding:0;margin:0;border:0;background:transparent;opacity:0;cursor:pointer;z-index:20;display:block}
.chat-exit-hit:focus,.chat-exit-hit:hover,.chat-exit-hit:active{background:transparent;outline:none;opacity:0}
.offline-chat .chat-head .offline-exit-hit{position:absolute;left:0;top:0;width:72px;height:100%;padding:0;margin:0;border:0;background:transparent;opacity:0;cursor:pointer;z-index:999;display:block;pointer-events:auto}
.offline-chat .chat-head .offline-exit-hit:focus,.offline-chat .chat-head .offline-exit-hit:hover,.offline-chat .chat-head .offline-exit-hit:active{background:transparent;outline:none;opacity:0}
.chat-head .title{position:absolute;left:50%;transform:translateX(-50%);font-size:14.5px;font-weight:600;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .btn-l,.chat-head .btn-r{border:0;background:transparent;font-size:13px;color:var(--blue);padding:6px 8px;cursor:pointer;font-weight:500}
.chat-head .btn-r{margin-left:auto;font-size:18px;color:#3a3a3c;letter-spacing:1px}
.msg-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 10px 4px}
.msg-row{display:flex;margin-bottom:14px;align-items:flex-start;gap:6px;position:relative}
.msg-row.user{flex-direction:row-reverse}
.msg-meta{width:38px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.msg-meta .av{width:32px;height:32px;border-radius:50%;background:#dcdce1 center/cover no-repeat;cursor:pointer;position:relative;flex-shrink:0}
.msg-meta .av:active{opacity:.7}
.msg-meta .ts{font-size:9.5px;color:#a8a8ae;white-space:nowrap}
.msg-body{max-width:calc(100% - 100px);display:flex;flex-direction:column;gap:3px;position:relative}
.bubble{border-radius:16px;padding:9px 12px;font-size:13.5px;line-height:1.5;word-break:break-word;white-space:pre-wrap;box-shadow:0 1px 2px rgba(0,0,0,.04);position:relative}
.bubble.char{background:#fff;color:#1c1c1e;border-top-left-radius:5px}
.bubble.user{background:linear-gradient(180deg,#2c2c2e,#1c1c1e);color:#fff;border-top-right-radius:5px}
/* 线上聊天旁白是 .msg-scroll 的直接子项，不属于任何消息气泡/消息行。 */
.narr-row{display:block;flex:none;position:relative;left:auto;width:100%;max-width:100%;min-width:0;margin:7px 0 13px;padding:5px 8px;text-align:center;font-size:12px;line-height:1.65;font-style:italic!important;font-weight:400!important;color:#8a8a92;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;pointer-events:auto}
.narr-row .checkbox-wrap{left:0;right:auto}
.msg-meta-spacer{width:38px;min-width:38px;flex:0 0 38px;height:1px}

/* ===== 线上聊天 · 微信风格加号功能面板 / 表情面板 ===== */
.chat-plus-panel{
  flex:0 0 auto;
  width:100%;
  background:#f7f7f7;
  border-top:0;
  border-bottom:1px solid #e5e5ea;
  padding:10px 12px 12px;
  box-shadow:0 4px 14px rgba(0,0,0,.035);
}
.chat-plus-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px 10px;
}
.chat-plus-item{
  border:0;
  background:transparent;
  padding:0;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  color:#3a3a3c;
  font-size:11.5px;
  line-height:1.2;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.chat-plus-item .icon{
  width:54px;
  height:54px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:#fff;
  border:1px solid rgba(60,60,67,.06);
  box-shadow:0 1px 4px rgba(0,0,0,.04);
  font-size:26px;
  color:#2c2c2e;
}
.chat-plus-item:active .icon{transform:scale(.96);background:#efeff4}
.chat-plus-item .label{
  max-width:72px;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-sticker-panel{
  flex:0 0 auto;
  width:100%;
  background:#f7f7f7;
  border-top:0;
  border-bottom:1px solid #e5e5ea;
  padding:0 10px 10px;
  box-shadow:0 4px 14px rgba(0,0,0,.035);
}
.chat-sticker-head{
  min-height:44px;
  display:flex;
  align-items:center;
  gap:8px;
  border-bottom:1px solid #e5e5ea;
}
.chat-sticker-head .back{
  width:32px;
  height:32px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#3a3a3c;
  font-size:22px;
  display:grid;
  place-items:center;
}
.chat-sticker-head .title{
  flex:1;
  text-align:center;
  font-size:13px;
  font-weight:600;
  color:#1c1c1e;
  transform:translateX(-18px);
}
.chat-sticker-head .manage{
  flex:0 0 auto;
  min-height:30px;
  padding:0 10px;
  border:1px solid #dedee3;
  border-radius:9px;
  background:#fff;
  color:#3a3a3c;
  font-size:11px;
}
.chat-sticker-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px 8px;
  max-height:320px;
  overflow-y:auto;
  padding:12px 2px 6px;
  -webkit-overflow-scrolling:touch;
}
.chat-sticker-cell{
  min-width:0;
  border:0;
  background:transparent;
  padding:0;
  text-align:center;
  cursor:pointer;
  color:#3a3a3c;
}
.chat-sticker-cell .image-wrap{
  width:100%;
  aspect-ratio:1/1;
  border-radius:10px;
  background:#fff;
  border:1px solid #ececf0;
  display:grid;
  place-items:center;
  overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.035);
}
.chat-sticker-cell img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  padding:5px;
}
.chat-sticker-cell .desc{
  margin-top:5px;
  min-height:28px;
  padding:0 1px;
  font-size:10.5px;
  line-height:1.35;
  color:#3a3a3c;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  overflow:hidden;
  word-break:break-all;
}
.chat-sticker-cell:active .image-wrap{transform:scale(.97);background:#f0f0f4}
.chat-sticker-cell .del{
  position:absolute;
  top:3px;
  right:3px;
  width:20px;
  height:20px;
  border:0;
  border-radius:50%;
  background:rgba(28,28,30,.62);
  color:#fff;
  font-size:11px;
  line-height:1;
  display:grid;
  place-items:center;
  cursor:pointer;
}
.chat-sticker-cell-wrap{position:relative;min-width:0}
.chat-sticker-empty{
  padding:28px 16px 20px;
  text-align:center;
  color:#8a8a8e;
  font-size:12px;
}
.chat-sticker-foot{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding-top:6px;
  color:#8a8a8e;
  font-size:10px;
}
@media (max-width:370px){
  .chat-sticker-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 9px}
  .chat-plus-item .icon{width:50px;height:50px}
}

  try {
    const base = new URL("./", location.href);
    const manifest = {
      id: base.href,
      name: "missy-phone",
      short_name: "missy",
      description: "模拟手机交互的 AI 聊天应用",
      start_url: base.href,
      scope: base.href,
      display: "standalone",
      display_override: ["window-controls-overlay", "standalone", "minimal-ui"],
      orientation: "portrait",
      background_color: "#f5f5f7",
      theme_color: "#f5f5f7",
      lang: "zh-CN",
      icons: [
        // 本地内嵌图标优先，避免图床短暂不可用导致安装图标缺失。
        { src: iconLocal192, sizes: "192x192", type: "image/png", purpose: "any" },
        { src: iconLocal512, sizes: "512x512", type: "image/png", purpose: "any" },
        // 同时保留外部图床版本，便于浏览器在支持时使用外部资源。
        { src: iconExternal, sizes: "192x192", type: "image/png", purpose: "any" },
        { src: iconExternal, sizes: "512x512", type: "image/png", purpose: "any" }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
    const href = URL.createObjectURL(blob);
    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = href;
    document.head.appendChild(link);
    window.__missyPwaManifest = manifest;
    window.__missyPwaManifestUrl = href;
  } catch (_) {
    window.__missyPwaManifest = null;
    window.__missyPwaManifestUrl = "";
  }

  const pwa = {
    deferredPrompt: null,
    installable: false,
    isStandalone() {
      return !!((window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true);
    },
    async install() {
      if (!this.deferredPrompt) return false;
      try {
        this.deferredPrompt.prompt();
        const result = await this.deferredPrompt.userChoice;
        this.deferredPrompt = null;
        this.installable = false;
        window.dispatchEvent(new CustomEvent("missy-pwa-install-state", {
          detail: { installable: false, outcome: result && result.outcome }
        }));
        return !!(result && result.outcome === "accepted");
      } catch (_) {
        return false;
      }
    }
  };
  window.__missyPwa = pwa;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    pwa.deferredPrompt = e;
    pwa.installable = true;
    window.dispatchEvent(new CustomEvent("missy-pwa-install-state", { detail: { installable: true } }));
  });
  window.addEventListener("appinstalled", () => {
    pwa.deferredPrompt = null;
    pwa.installable = false;
    window.dispatchEvent(new CustomEvent("missy-pwa-install-state", { detail: { installable: false, installed: true } }));
  });
})();

<style id="missy-first-open-notice-style">
  #missy-first-open-notice{
    position:fixed;inset:0;z-index:2147483646;display:none;align-items:center;justify-content:center;
    padding:max(14px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));
    background:rgba(20,24,32,.44);-webkit-backdrop-filter:blur(10px) saturate(125%);backdrop-filter:blur(10px) saturate(125%);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    overscroll-behavior:contain;touch-action:manipulation;
  }
  #missy-first-open-notice.is-visible{display:flex}
  #missy-first-open-notice *{box-sizing:border-box}
  .missy-notice-card{
    width:min(100%,720px);height:min(92vh,900px);height:min(92dvh,900px);max-height:calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 24px);max-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 24px);
    display:flex;flex-direction:column;min-height:0;overflow:hidden;border-radius:28px;
    background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.92);
    box-shadow:0 28px 90px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.95);
  }
  .missy-notice-head{flex:0 0 auto;padding:18px 18px 12px;border-bottom:1px solid rgba(60,60,67,.10);background:rgba(255,255,255,.76);}
  .missy-notice-kicker{font-size:11px;line-height:1.4;color:#8e8e93;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
  .missy-notice-title{font-size:22px;line-height:1.25;font-weight:750;letter-spacing:-.025em;color:#1d1d1f;margin:0}
  .missy-notice-subtitle{margin-top:5px;font-size:12px;line-height:1.55;color:#6e6e73}
  .missy-notice-scroll{
    flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    padding:16px 18px 18px;color:#3a3a3c;font-size:13px;line-height:1.78;scrollbar-width:thin;
  }
  .missy-notice-scroll h3{margin:0 0 8px;color:#1d1d1f;font-size:15px;line-height:1.45;font-weight:750}
  .missy-notice-scroll h3:not(:first-child){margin-top:18px}
  .missy-notice-scroll p{margin:0 0 11px}
  .missy-notice-scroll .notice-strong{color:#1d1d1f;font-weight:700}
  .missy-notice-scroll .notice-note{padding:11px 12px;margin:10px 0 14px;border-radius:15px;background:rgba(10,132,255,.07);border:1px solid rgba(10,132,255,.12);color:#3a3a3c}
  .missy-notice-scroll ol{margin:0;padding-left:21px}
  .missy-notice-scroll li{margin:0 0 12px;padding-left:2px}
  .missy-notice-scroll li > ol{margin-top:10px}
  .missy-notice-scroll ul{margin:8px 0 0;padding-left:18px}
  .missy-notice-scroll li li{margin-bottom:8px}
  .missy-notice-end{margin-top:16px;padding:12px 13px;border-radius:15px;background:rgba(118,118,128,.08);border:1px solid rgba(60,60,67,.08)}
  .missy-notice-foot{flex:0 0 auto;padding:12px 14px max(14px,env(safe-area-inset-bottom));border-top:1px solid rgba(60,60,67,.10);background:rgba(255,255,255,.86)}
  .missy-notice-read-status{display:flex;align-items:center;justify-content:center;gap:6px;min-height:20px;margin-bottom:9px;font-size:11px;color:#8e8e93;text-align:center}
  .missy-notice-read-status.ready{color:#34c759;font-weight:650}
  .missy-notice-check{display:flex;align-items:center;gap:9px;min-height:38px;padding:2px 2px 8px;color:#3a3a3c;font-size:13px;cursor:pointer;user-select:none}
  .missy-notice-check input{position:absolute;opacity:0;pointer-events:none}
  .missy-notice-box{width:20px;height:20px;flex:0 0 20px;border-radius:6px;border:1.5px solid #c7c7cc;background:#fff;display:grid;place-items:center;transition:.16s ease}
  .missy-notice-check input:checked + .missy-notice-box{background:#0a84ff;border-color:#0a84ff}
  .missy-notice-check input:checked + .missy-notice-box::after{content:"";width:10px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}
  .missy-notice-agree{width:100%;min-height:48px;border:0;border-radius:16px;background:#0a84ff;color:#fff;font-size:15px;font-weight:700;letter-spacing:.01em;box-shadow:0 8px 18px rgba(10,132,255,.22);cursor:pointer;touch-action:manipulation}
  .missy-notice-agree:disabled{background:#b9c8d8;color:rgba(255,255,255,.95);box-shadow:none;cursor:not-allowed}
  .missy-notice-agree:not(:disabled):active{transform:scale(.99)}
  .missy-notice-hint{margin-top:7px;font-size:10.5px;line-height:1.45;color:#8e8e93;text-align:center}
  @media (max-width:560px){
    #missy-first-open-notice{padding-left:8px;padding-right:8px}
    .missy-notice-card{width:100%;height:min(94vh,900px);height:min(94dvh,900px);border-radius:24px}
    .missy-notice-head{padding:16px 15px 11px}.missy-notice-title{font-size:20px}
    .missy-notice-scroll{padding:14px 15px 16px;font-size:12.5px;line-height:1.76}
    .missy-notice-foot{padding:10px 12px max(12px,env(safe-area-inset-bottom))}
  }
  @media (max-height:620px){
    .missy-notice-card{height:calc(100vh - 10px);height:calc(100dvh - 10px);max-height:calc(100vh - 10px);max-height:calc(100dvh - 10px);border-radius:20px}
    .missy-notice-head{padding-top:11px;padding-bottom:9px}.missy-notice-subtitle{display:none}
    .missy-notice-scroll{padding-top:11px;padding-bottom:12px}.missy-notice-foot{padding-top:8px}

      };

const keepAlive = {
  ctx: null, osc: null, gain: null, running: false,
  start() {
    if (this.running) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      if (!this.ctx) this.ctx = new AC();
      if (this.ctx.state === "suspended") { try { this.ctx.resume(); } catch (_) {} }
      this.gain = this.ctx.createGain();
      this.gain.gain.value = 0.0001;
      this.osc = this.ctx.createOscillator();
      this.osc.type = "sine"; this.osc.frequency.value = 20;
      this.osc.connect(this.gain); this.gain.connect(this.ctx.destination);
      this.osc.start(); this.running = true; return true;
    } catch (e) { this.running = false; return false; }
  },
  stop() {
    try {
      if (this.osc) { try { this.osc.stop(); } catch (_) {} this.osc.disconnect(); }
      if (this.gain) this.gain.disconnect();
    } catch (_) {}
    this.osc = null; this.gain = null; this.running = false;
  },

  function buildMomentMemoryContext(friend) {
    const list = (store.state.moments || []).filter((m) => m.friendId === friend.id && Array.isArray(m.comments) && m.comments.length);
    if (!list.length) return "";
    const recent = list.slice().sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)).slice(0, 8);
    const lines = [];
    recent.forEach((m) => {
      const author = m.authorType === "char" ? "{char}" : "{user}";
      const head = author + "发布动态：" + String(m.content || "（图片动态）").slice(0, 160);
      lines.push(head);
      (m.comments || []).slice(-10).forEach((c) => {
        const who = c.authorType === "char" ? "{char}" : (c.authorType === "user" ? "{user}" : (c.authorName || "NPC"));
        const relation = c.relation ? "（" + c.relation + "）" : "";
        lines.push("- " + who + relation + "评论：" + String(c.content || "").slice(0, 160));
      });
    });
    return lines.length ? "【动态与评论互动记忆】\n" + lines.join("\n") : "";
  }
  function buildMemoryContext(friend) {
    const allMemories = getFriendMemories(friend.id).filter(m => m.tier !== "archived");
    allMemories.sort((a, b) => getDecayedImportance(b) - getDecayedImportance(a));
    const permanent = allMemories.filter(m => m.tier === "permanent");
    const longTerm = allMemories.filter(m => m.tier === "long_term").slice(0, 3);
    const shortTerm = allMemories.filter(m => m.tier === "short_term").slice(0, 5);
    const parts = [];
    if (permanent.length) parts.push("【永久记忆（核心准则）】\n" + permanent.map(m => "- " + m.text).join("\n"));
    if (longTerm.length) parts.push("【长期记忆】\n" + longTerm.map(m => "- " + m.text).join("\n"));
    if (shortTerm.length) parts.push("【近期记忆】\n" + shortTerm.map(m => "- " + m.text).join("\n"));
    const social = buildMomentMemoryContext(friend);
    if (social) parts.push(social);
    return parts.join("\n\n");
  }

  function normalizeCrossSceneRawCount(value, fallback = 12) {
    const n = Number(value);
    if (!Number.isFinite(n)) return fallback;
    return Math.max(0, Math.min(200, Math.floor(n)));
  }

  function buildCrossSceneContext(friend, scene) {
    const activeScene = scene === "offline" ? "offline" : "online";
    const otherScene = activeScene === "online" ? "offline" : "online";
    const label = otherScene === "online" ? "线上聊天" : "线下约会";
    const rawCount = normalizeCrossSceneRawCount(friend && friend.crossSceneRawCount, 12);
    if (rawCount <= 0) return "";
    const source = (friend.messages || []).filter((m) => {
      const msgScene = m && m.scene;
      const inOtherScene = otherScene === "online" ? (!msgScene || msgScene === "online" || msgScene === "legacy") : msgScene === "offline";
      return inOtherScene && !isThinkOnlyMessage(m);
    }).slice(-rawCount);
    if (!source.length) return "";
    const lines = source.map((m) => {
      const stamp = m.ts ? "（" + fmtDate(m.ts) + " " + fmtTime(m.ts) + "）" : "";
      const content = formatChatMessageForAI(m, m.role === "user" ? "{user}" : "{char}")
        .replace(/<think>[\s\S]*?<\/think>/gi, "")
        .replace(/<heart>[\s\S]*?<\/heart>/gi, "")
        .replace(/<[^>]+>/g, "")
        .trim() || "……";
      return "- " + stamp + " " + content;
    });
    return "【跨场景最近互动记忆·" + label + "】\n" + lines.join("\n") + "\n以上内容属于你们同一段关系中的共同经历；当前场景可以自然回忆、提及或承接，但不要机械复述。";
  }

  function buildProactiveMemoryContext(friend) {
    const memories = getFriendMemories(friend.id);
    const formatMemory = (m) => {
      const text = String(m && m.text || "").replace(/[\u0000-\u001f\u007f]/g, "").trim();
      return text ? "- " + text : "";
    };
    const permanent = memories.filter((m) => m && m.tier === "permanent");
    const longTerm = memories.filter((m) => m && m.tier === "long_term");
    const shortTerm = memories.filter((m) => m && m.tier === "short_term");
    const economicPattern = /(转账|红包|钱|金额|元|¥|工资|薪资|收入|奖金|存款|余额|银行卡|银行|账户|账单|付款|支付|买单|请客|还钱|还款|借钱|借款|垫付|报销|费用|花费|消费|房租|房贷|学费|生活费|零花钱|欠款|债务|债|奖励|礼物|买东西|购买|退款|补偿|赔偿|AA|AA制)/i;
    const economicMemories = memories.filter((m) => economicPattern.test(String(m && m.text || "")));
    const transferEvents = (friend.messages || []).filter((m) => m && m.type === "transfer").map((m) => formatChatMessageForAI(m, m.role === "user" ? "{user}" : "{char}"));
    const parts = [];
    if (permanent.length) parts.push("【{char}完整永久记忆】\n" + permanent.map(formatMemory).filter(Boolean).join("\n"));
    else parts.push("【{char}完整永久记忆】\n暂无");
    if (longTerm.length) parts.push("【{char}完整长期记忆】\n" + longTerm.map(formatMemory).filter(Boolean).join("\n"));
    else parts.push("【{char}完整长期记忆】\n暂无");
    if (shortTerm.length) parts.push("【{char}完整短期记忆】\n" + shortTerm.map(formatMemory).filter(Boolean).join("\n"));
    else parts.push("【{char}完整短期记忆】\n暂无");
    if (economicMemories.length) {
      parts.push("【已有经济相关记忆·优先参考】\n" + economicMemories.map(formatMemory).filter(Boolean).join("\n"));
    } else {
      parts.push("【已有经济相关记忆·优先参考】\n暂无明确的经济相关记忆");
    }
    if (transferEvents.length) {
      parts.push("【历史转账事件·优先参考】\n" + transferEvents.join("\n"));
    }
    return parts.join("\n\n");
  }

  function getUnrememberedMomentEvents(friend) {
    const cursor = Number(friend.lastSummarizedMomentTs || 0);
    const moments = (store.state.moments || []).filter((m) => {
      if (m.friendId !== friend.id || !Array.isArray(m.comments) || !m.comments.length) return false;
      const latest = Math.max(Number(m.timestamp || 0), ...m.comments.map((c) => Number(c.ts || c.timestamp || m.timestamp || 0)));
      return latest > cursor;
    }).sort((a,b) => (a.timestamp || 0) - (b.timestamp || 0));
    const lines = [];
    let latestTs = cursor;
    moments.forEach((m) => {
      const momentTs = Number(m.timestamp || 0);
      const freshComments = (m.comments || []).filter((c) => Number(c.ts || c.timestamp || m.timestamp || 0) > cursor);
      if (momentTs > cursor) {
        const author = m.authorType === "char" ? "{char}" : "{user}";
        lines.push(author + "发布动态：" + String(m.content || "（图片动态）").slice(0, 240));
        latestTs = Math.max(latestTs, momentTs);
      }
      freshComments.forEach((c) => {
        const ts = Number(c.ts || c.timestamp || m.timestamp || 0);
        const who = c.authorType === "char" ? "{char}" : (c.authorType === "user" ? "{user}" : (c.authorName || "NPC"));
        const relation = c.relation ? "（" + c.relation + "）" : "";
        lines.push("- " + who + relation + "评论：" + String(c.content || "").slice(0, 240));
        latestTs = Math.max(latestTs, ts);
      });
    });
    return { lines, latestTs };
  }

  async function generateSummary(messages, type) {
    const api = getSummarizeApi();
    if (!api) throw new Error("未配置 API，无法生成总结");
    const customPrompts = (store.state.memory && store.state.memory.summaryPrompts) || {};
    const jsonFormatRule = "\n\n请严格输出 JSON 格式，不要包含其他任何内容（不要使用 markdown 代码块标记）：";
    let prompt;
    if (type === "short") {
      const basePrompt = (customPrompts.short && customPrompts.short.trim()) ? customPrompts.short.trim() : `请阅读以下对话记录，提炼出一条简短的短期记忆。要求：\n1. 概括发生了什么重要的事、情绪变化或承诺\n2. 以角色（{char}）的第一人称视角描述\n3. 不超过80字`;
      prompt = basePrompt + jsonFormatRule + `\n{"text": "总结内容", "valence": 0.8, "arousal": 0.6, "importance": 7}\n（valence 为效价 0~1，arousal 为唤醒度 0~1，importance 为重要度 1~10）`;
    } else if (type === "long") {
      const basePrompt = (customPrompts.long && customPrompts.long.trim()) ? customPrompts.long.trim() : `请阅读以下短期记忆条目，将它们合并总结为一条长期记忆。要求：\n1. 提取跨条目的共性主题、重要事件和关系变化\n2. 以角色（{char}）的第一人称视角描述\n3. 不超过150字`;
      prompt = basePrompt + jsonFormatRule + `\n{"text": "总结内容", "valence": 0.5, "arousal": 0.5, "importance": 8}`;
    } else if (type === "permanent") {
      const basePrompt = (customPrompts.permanent && customPrompts.permanent.trim()) ? customPrompts.permanent.trim() : `请阅读以下长期记忆条目，将它们提炼为一条永久记忆（核心准则）。要求：\n1. 提取最核心的、不会随时间改变的关系准则和重要事实\n2. 以角色（{char}）的第一人称视角描述\n3. 不超过200字`;
      prompt = basePrompt + jsonFormatRule + `\n{"text": "总结内容", "valence": 0.5, "arousal": 0.5, "importance": 10}`;
    }
    const content = Array.isArray(messages) ? messages.map((m) => (typeof m === "string" ? m : String(m))).join("\n") : String(messages);
    const apiMessages = [{ role: "system", content: prompt }, { role: "user", content: content }];
    const res = await callAI(apiMessages);
    const raw = String(res || "");
    let jsonStr = raw.replace(/```json/gi, "").replace(/```/g, "").trim();
    let parsed = null;
    try { parsed = JSON.parse(jsonStr); } catch (_) {
      const m = jsonStr.match(/\{[\s\S]*\}/);
      if (m) { try { parsed = JSON.parse(m[0]); } catch (_) { parsed = null; } }
    }
    if (!parsed || typeof parsed !== "object") throw new Error("AI 未返回有效 JSON：" + raw.slice(0, 120));
    const num = (v, min, max, dflt) => { const n = Number(v); if (!Number.isFinite(n)) return dflt; return Math.max(min, Math.min(max, n)); };
    const defaultImportance = type === "permanent" ? 10 : (type === "long" ? 7 : 5);
    return {
      text: String(parsed.text || "").trim() || "（无内容）",
      valence: num(parsed.valence, 0, 1, 0.5), arousal: num(parsed.arousal, 0, 1, 0.5),
      importance: num(parsed.importance, 1, 10, defaultImportance),
    };
  }

  async function fetchWithTimeout(url, options, timeoutMs = 30000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const init = Object.assign({}, options || {}, { signal: controller.signal });
      return await fetch(url, init);
    } catch (e) {
      if (e && e.name === "AbortError") throw new Error(`请求超时（${Math.round(timeoutMs / 1000)} 秒）`);
      throw e;
    } finally {
      clearTimeout(timer);
    }
  }

  async function generateEmbedding(text) {
    const cfg = store.state.memory.embedApi;
    if (!cfg.baseUrl || !cfg.apiKey) return null;
    try {
      const base = cfg.baseUrl.replace(/\/+$/, "");
      const res = await fetchWithTimeout(base + "/embeddings", {
        method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg.apiKey },
        body: JSON.stringify({ model: cfg.model, input: text }),
      });
      if (!res.ok) return null;
      const json = await res.json();
      if (json.data && json.data[0] && json.data[0].embedding) return json.data[0].embedding;
      return null;
    } catch (_) { return null; }
  }

  function ensureMemorySummaryMarkers(friend) {
    if (!friend || !Array.isArray(friend.messages)) return;
    const countableMsgs = friend.messages.filter((m) => {
      if (m.role !== "user" && m.role !== "char") return false;
      return !isThinkOnlyMessage(m);
    });
    const legacyCount = Math.max(0, Math.min(Number(friend.lastSummarizedMsgCount || 0), countableMsgs.length));
    if (legacyCount <= 0) {
      friend.lastSummarizedMsgCount = countableMsgs.filter((m) => m && m._memorySummarized === true).length;
      return;
    }
    let markedCount = 0;
    for (const m of countableMsgs) {
      if (m && m._memorySummarized === true) markedCount++;
    }
    if (markedCount < legacyCount) {
      for (const m of countableMsgs) {
        if (markedCount >= legacyCount) break;
        if (m && m._memorySummarized !== true) {
          m._memorySummarized = true;
          markedCount++;
        }
      }
    }
    friend.lastSummarizedMsgCount = countableMsgs.filter((m) => m && m._memorySummarized === true).length;
  }

  function normalizeMemoryDuplicateKey(value) {
    return String(value || "")
      .toLowerCase()
      .replace(/[\u0000-\u001f\u007f]/g, "")
      .replace(/[“”「」『』"'‘’`]/g, "")
      .replace(/[，。！？；：、,.!?;:…—_\-\s]+/g, "")
      .trim();
  }

  function memoryEmbeddingCosine(a, b) {
    if (!Array.isArray(a) || !Array.isArray(b) || !a.length || a.length !== b.length) return null;
    let dot = 0, na = 0, nb = 0;
    for (let i = 0; i < a.length; i++) {
      const av = Number(a[i]), bv = Number(b[i]);
      if (!Number.isFinite(av) || !Number.isFinite(bv)) return null;
      dot += av * bv;
      na += av * av;
      nb += bv * bv;
    }
    if (!(na > 0) || !(nb > 0)) return null;
    return dot / Math.sqrt(na * nb);
  }

  function sameMemorySourceSet(a, b) {
    if (!Array.isArray(a) || !Array.isArray(b) || !a.length || a.length !== b.length) return false;
    const aa = Array.from(new Set(a.map((x) => String(x)))).sort();
    const bb = Array.from(new Set(b.map((x) => String(x)))).sort();
    return aa.length === bb.length && aa.every((v, i) => v === bb[i]);
  }

  function memoryDuplicateKeeperScore(memory) {
    return (memory && memory.pinned ? 1000000 : 0)
      + (memory && memory.digested ? 10000 : 0)
      + (memory && memory.resolved ? 5000 : 0)
      + (Number(memory && memory.importance) || 0) * 100
      + (memory && Array.isArray(memory.embedding) && memory.embedding.length ? 10 : 0)
      + Math.min(9, Math.max(0, Number(memory && memory.activationCount) || 0));
  }

  function mergeDuplicateMemoryMeta(keeper, duplicate) {
    if (!keeper || !duplicate) return;
    keeper.importance = Math.max(Number(keeper.importance) || 0, Number(duplicate.importance) || 0);
    keeper.arousal = Math.max(Number(keeper.arousal) || 0, Number(duplicate.arousal) || 0);
    if (!Array.isArray(keeper.embedding) && Array.isArray(duplicate.embedding)) keeper.embedding = duplicate.embedding;
    keeper.pinned = !!(keeper.pinned || duplicate.pinned);
    keeper.resolved = !!(keeper.resolved || duplicate.resolved);
    keeper.digested = !!(keeper.digested || duplicate.digested);
    keeper.activationCount = Math.max(Number(keeper.activationCount) || 0, Number(duplicate.activationCount) || 0);
    keeper.lastAccessedAt = Math.max(Number(keeper.lastAccessedAt) || 0, Number(duplicate.lastAccessedAt) || 0);
    if ((!Array.isArray(keeper.sourceMessageIds) || !keeper.sourceMessageIds.length) && Array.isArray(duplicate.sourceMessageIds) && duplicate.sourceMessageIds.length) {
      keeper.sourceMessageIds = duplicate.sourceMessageIds.slice();
    }
    if ((!Array.isArray(keeper.sourceMemoryIds) || !keeper.sourceMemoryIds.length) && Array.isArray(duplicate.sourceMemoryIds) && duplicate.sourceMemoryIds.length) {
      keeper.sourceMemoryIds = duplicate.sourceMemoryIds.slice();
    }
  }

  function dedupeFriendMemoryDuplicates(friend) {
    if (!friend || !friend.id || !store.state.memory || !Array.isArray(store.state.memory.memories)) return false;
    const friendMemories = store.state.memory.memories.filter((m) => m && m.friendId === friend.id && m.tier !== "archived");
    if (friendMemories.length < 2) return false;
    const removeIds = new Set();

    for (let i = 0; i < friendMemories.length; i++) {
      const a = friendMemories[i];
      if (!a || removeIds.has(a.id)) continue;
      for (let j = i + 1; j < friendMemories.length; j++) {
        const b = friendMemories[j];
        if (!b || removeIds.has(b.id) || a.tier !== b.tier) continue;
        const exactSource = a.tier === "short_term"
          ? sameMemorySourceSet(a.sourceMessageIds, b.sourceMessageIds)
          : sameMemorySourceSet(a.sourceMemoryIds, b.sourceMemoryIds);
        const keyA = normalizeMemoryDuplicateKey(a.text);
        const keyB = normalizeMemoryDuplicateKey(b.text);
        const exactText = !!keyA && keyA === keyB;
        let semanticDuplicate = false;
        if (!exactSource && !exactText && a.tier === "short_term" && !a.pinned && !b.pinned) {
          const createdA = Number(a.createdAt) || 0;
          const createdB = Number(b.createdAt) || 0;
          const withinWindow = createdA > 0 && createdB > 0 && Math.abs(createdA - createdB) <= 30 * 24 * 60 * 60 * 1000;
          const lenA = keyA.length, lenB = keyB.length;
          const similarLength = lenA >= 12 && lenB >= 12 && Math.min(lenA, lenB) / Math.max(lenA, lenB) >= 0.82;
          const cosine = memoryEmbeddingCosine(a.embedding, b.embedding);
          semanticDuplicate = withinWindow && similarLength && cosine != null && cosine >= 0.985;
        }
        if (!(exactSource || exactText || semanticDuplicate)) continue;
        if (a.pinned && b.pinned) continue;
        const keeper = memoryDuplicateKeeperScore(b) > memoryDuplicateKeeperScore(a) ? b : a;
        const duplicate = keeper === a ? b : a;
        mergeDuplicateMemoryMeta(keeper, duplicate);
        removeIds.add(duplicate.id);
      }
    }
    if (!removeIds.size) return false;
    store.state.memory.memories.splice(0, store.state.memory.memories.length, ...store.state.memory.memories.filter((m) => !removeIds.has(m && m.id)));
    return true;
  }

  async function checkAndSummarize(friend, forceManual) {
    const mem = store.state.memory;
    if (!forceManual && !mem.autoSummarize) return false;
    if (!getSummarizeApi()) throw new Error("未配置记忆总结 API，请先配置后再试");
    if (friend._summarizing) return false;
    if (!forceManual && friend._lastSummaryFailAt && (now() - friend._lastSummaryFailAt) < 60000) return false;
    friend._summarizing = true;
    try {
      let progressed = false;
      ensureMemorySummaryMarkers(friend);
      dedupeFriendMemoryDuplicates(friend);
      const countableMsgs = (friend.messages || []).filter((m) => {
        if (m.role !== "user" && m.role !== "char") return false;
        return !isThinkOnlyMessage(m);
      });
      const pendingMsgs = countableMsgs.filter((m) => !m || m._memorySummarized !== true);
      const newMsgCount = pendingMsgs.length;
      const social = getUnrememberedMomentEvents(friend);
      const threshold = Math.max(1, Number(mem.shortTermThreshold || 20));
      const shouldShort = forceManual ? (newMsgCount > 0 || social.lines.length > 0) : (newMsgCount >= threshold || social.lines.length >= threshold);
      if (shouldShort) {
        const recentMsgs = pendingMsgs;
        const chatLines = recentMsgs.map((m) => formatChatMessageForAI(m, m.role === "user" ? "用户" : "{char}")).filter(Boolean);
        const combinedLines = chatLines.concat(social.lines.map(x => "【动态互动】" + x));
        if (combinedLines.length > 0) {
          const summary = await generateSummary(combinedLines, "short");
          const embedding = await generateEmbedding(summary.text);
          store.state.memory.memories.push({
            id: uid("mem"), friendId: friend.id, maskId: friend.maskId || getActiveMask().id,
            text: summary.text, valence: summary.valence, arousal: summary.arousal, importance: summary.importance,
            tier: "short_term", resolved: false, digested: false, pinned: false,
            activationCount: 0, embedding: embedding, createdAt: now(), lastAccessedAt: now(),
            sourceMessageIds: pendingMsgs.map((m) => m && m.id).filter(Boolean),
          });
          pendingMsgs.forEach((m) => { if (m) m._memorySummarized = true; });
          dedupeFriendMemoryDuplicates(friend);
          friend.lastSummarizedMsgCount = countableMsgs.filter((m) => m && m._memorySummarized === true).length;
          if (social.latestTs > (friend.lastSummarizedMomentTs || 0)) friend.lastSummarizedMomentTs = social.latestTs;
          progressed = true;
          toast(forceManual ? "📝 手动短期记忆已总结" : "📝 短期记忆已总结");
        }
      }
      while (true) {
        const shortTermMems = getMemoriesByTier(friend.id, "short_term");
        const unresolvedShort = shortTermMems.filter((m) => !m.resolved);
        if (unresolvedShort.length < (mem.longTermThreshold || 10)) break;
        const toSummarize = unresolvedShort.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)).slice(0, mem.longTermThreshold || 10);
        const summary = await generateSummary(toSummarize.map((m) => m.text), "long");
        const embedding = await generateEmbedding(summary.text);
        store.state.memory.memories.push({
          id: uid("mem"), friendId: friend.id, maskId: friend.maskId || getActiveMask().id,
          text: summary.text, valence: summary.valence, arousal: summary.arousal, importance: summary.importance,
          tier: "long_term", resolved: false, digested: false, pinned: false,
          activationCount: 0, embedding: embedding, createdAt: now(), lastAccessedAt: now(),
          sourceMemoryIds: toSummarize.map((m) => m && m.id).filter(Boolean),
        });
        toSummarize.forEach((m) => { m.resolved = true; });
        dedupeFriendMemoryDuplicates(friend);
        progressed = true; toast(forceManual ? "📚 手动长期记忆已总结" : "📚 长期记忆已总结");
      }
      while (true) {
        const longTermMems = getMemoriesByTier(friend.id, "long_term");
        const unresolvedLong = longTermMems.filter((m) => !m.resolved);
        if (unresolvedLong.length < (mem.permanentThreshold || 20)) break;
        const toSummarize = unresolvedLong.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)).slice(0, mem.permanentThreshold || 20);
        const summary = await generateSummary(toSummarize.map((m) => m.text), "permanent");
        const embedding = await generateEmbedding(summary.text);
        store.state.memory.memories.push({
          id: uid("mem"), friendId: friend.id, maskId: friend.maskId || getActiveMask().id,
          text: summary.text, valence: summary.valence, arousal: summary.arousal, importance: summary.importance,
          tier: "permanent", resolved: false, digested: false, pinned: false,
          activationCount: 0, embedding: embedding, createdAt: now(), lastAccessedAt: now(),
          sourceMemoryIds: toSummarize.map((m) => m && m.id).filter(Boolean),
        });
        toSummarize.forEach((m) => { m.resolved = true; });
        dedupeFriendMemoryDuplicates(friend);

  function getStreamTextFromPayload(payload, provider) {

      const cands = payload.candidates || [];
      if (cands.length && cands[0].content && Array.isArray(cands[0].content.parts)) {
        return cands[0].content.parts.map((p) => p && typeof p.text === "string" ? p.text : "").join("");
      }
      return "";
    }
    const choice = (payload.choices && payload.choices[0]) || {};
    const delta = choice.delta || {};
    if (typeof delta.content === "string") return delta.content;
    if (Array.isArray(delta.content)) return delta.content.map((p) => typeof p === "string" ? p : String(p && p.text || "")).join("");
    if (typeof choice.text === "string") return choice.text;
    return "";
  }

  function getFullTextFromNormalPayload(json, provider) {
    if (!json || typeof json !== "object") return "";
    if (provider === "claude") {
      const blocks = json.content || [];
      return blocks.filter((b) => b && b.type === "text").map((b) => b.text).join("\n") || "";
    }
    if (provider === "gemini") {
      const cands = json.candidates || [];
      if (cands.length && cands[0].content && cands[0].content.parts) return cands[0].content.parts.map((p) => p.text || "").join("\n");
      return "";
    }
    const choice = (json.choices && json.choices[0]) || {};
    return (choice.message && choice.message.content) || choice.text || "";
  }

  const STREAM_IDLE_TIMEOUT_MS = 120000;
  const STREAM_TOTAL_TIMEOUT_MS = 600000;

  function getStreamErrorFromPayload(payload, eventName) {
    if (!payload || typeof payload !== "object") return "";
    const event = String(eventName || payload.type || "").trim().toLowerCase();
    if (event !== "error" && !payload.error && payload.type !== "error") return "";
    const err = payload.error;
    if (typeof err === "string" && err.trim()) return err.trim();
    if (err && typeof err === "object") {
      const message = String(err.message || err.detail || err.type || "").trim();
      if (message) return message;
      try { return JSON.stringify(err).slice(0, 500); } catch (_) {}
    }
    const message = String(payload.message || payload.detail || "").trim();
    if (message) return message;
    try { return JSON.stringify(payload).slice(0, 500); } catch (_) { return "未知 SSE 错误"; }
  }

  async function readAIStreamResponse(res, provider, onChunk, controller) {
    if (!res || !res.body || typeof res.body.getReader !== "function") {
      const json = await res.json();
      const streamError = getStreamErrorFromPayload(json, "");
      if (streamError) throw new Error("API 流式响应错误：" + streamError);
      const full = getFullTextFromNormalPayload(json, provider);
      if (full && typeof onChunk === "function") onChunk(full, full);
      return full;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";
    let rawText = "";
    let fullText = "";
    const startedAt = Date.now();
    let finished = false;
    const emit = (piece) => {
      if (!piece) return;
      fullText += piece;
      if (typeof onChunk === "function") onChunk(piece, fullText);
    };
    const handleEventData = (dataText, eventName) => {
      const raw = String(dataText || "").trim();
      if (!raw || raw === "[DONE]") return;
      let payload = null;
      try { payload = JSON.parse(raw); } catch (_) { throw new Error("API 流式响应数据格式错误"); }
      const streamError = getStreamErrorFromPayload(payload, eventName);
      if (streamError) throw new Error("API 流式响应错误：" + streamError);
      const piece = getStreamTextFromPayload(payload, provider);
      if (piece) emit(piece);
    };
    const consumeBuffer = (finalFlush = false) => {
      buffer = buffer.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      const frames = buffer.split("\n\n");
      if (!finalFlush) buffer = frames.pop() || "";
      else buffer = "";
      frames.forEach((frame) => {
        const lines = frame.split("\n");
        const eventLines = lines.filter((line) => line.startsWith("event:"));
        const dataLines = lines.filter((line) => line.startsWith("data:"));
        if (dataLines.length) {
          const eventName = eventLines.map((line) => line.slice(6).trim()).filter(Boolean).join("\n");
          handleEventData(dataLines.map((line) => line.slice(5).replace(/^ /, "")).join("\n"), eventName);
        }
      });
    };
    const abortAndCancel = async (message) => {
      try { await reader.cancel(message); } catch (_) {}
      try { if (controller && !controller.signal.aborted) controller.abort(); } catch (_) {}
      throw new Error(message);
    };
    try {
      while (true) {
        const elapsed = Date.now() - startedAt;
        const remainingTotal = STREAM_TOTAL_TIMEOUT_MS - elapsed;
        if (remainingTotal <= 0) await abortAndCancel("API 流式输出超过 10 分钟，已自动终止");
        const readTimeout = Math.min(STREAM_IDLE_TIMEOUT_MS, remainingTotal);
        let timeoutId = null;
        const timeoutPromise = new Promise((_, reject) => {
          timeoutId = setTimeout(() => reject(new Error("__STREAM_IDLE_TIMEOUT__")), readTimeout);
        });
        let part;
        try {
          part = await Promise.race([reader.read(), timeoutPromise]);
        } catch (e) {
          if (e && e.message === "__STREAM_IDLE_TIMEOUT__") {
            await abortAndCancel("API 流式输出连续 120 秒没有收到新数据，已自动终止");
          }
          throw e;
        } finally {
          if (timeoutId) clearTimeout(timeoutId);
        }
        if (part.done) { finished = true; break; }
        const decoded = decoder.decode(part.value, { stream: true });
        rawText += decoded;
        buffer += decoded;
        consumeBuffer(false);
      }
      const tail = decoder.decode();
      rawText += tail;
      buffer += tail;
      consumeBuffer(true);
      if (!fullText) {
        const fallback = rawText.trim();
        if (fallback && (fallback.startsWith("{") || fallback.startsWith("["))) {
          try {
            const json = JSON.parse(fallback);
            const streamError = getStreamErrorFromPayload(json, "");
            if (streamError) throw new Error("API 流式响应错误：" + streamError);
            const full = getFullTextFromNormalPayload(json, provider);
            if (full && typeof onChunk === "function") onChunk(full, full);
            return full;
          } catch (e) {
            if (e && /API 流式响应错误/.test(e.message || "")) throw e;
          }
        }
      }
      return fullText;
    } catch (e) {
      if (e && e.message === "__STREAM_IDLE_TIMEOUT__") throw new Error("API 流式输出连续 120 秒没有收到新数据，已自动终止");
      if (e && e.name === "AbortError") throw new Error("API 流式请求已中断或超时");
      throw e;
    } finally {
      if (!finished) {
        try { await reader.cancel(); } catch (_) {}
      }
      try { reader.releaseLock(); } catch (_) {}
    }
  }

  function streamingChatPreview(text) {

    const controller = new AbortController();

    let res;
    try { res = await fetch(url, { method: "POST", headers, body: JSON.stringify(body), signal: controller.signal }); }
    catch (e) { clearTimeout(timer); if (e.name === "AbortError") throw new Error("请求超时（60 秒）"); throw new Error("网络请求失败：" + (e.message || "可能被 CORS 拦截")); }

    if (!res.ok) { let detail = ""; try { detail = (await res.text()).slice(0, 300); } catch (_) {} throw new Error("HTTP " + res.status + (detail ? " · " + detail : "")); }
    if (streamingEnabled) return await readAIStreamResponse(res, provider, onChunk, controller);
    const json = await res.json();
    return getFullTextFromNormalPayload(json, provider);
  }

  function blobToBase64(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsDataURL(b); }); }
  async function serialize(obj) {
    if (obj instanceof Blob) { const data = await blobToBase64(obj); return { __blob: true, type: obj.type, data }; }
    if (Array.isArray(obj)) return Promise.all(obj.map(serialize));
    if (obj && typeof obj === "object") { const out = {}; for (const k of Object.keys(obj)) out[k] = await serialize(obj[k]); return out; }
    return obj;
  }
  function deserialize(obj) {
    if (Array.isArray(obj)) return obj.map(deserialize);
    if (obj && typeof obj === "object") {
      if (obj.__blob && typeof obj.data === "string") {
        const part = obj.data.split(",")[1] || "";
        const bin = atob(part); const u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        return markRawBlob(new Blob([u8], { type: obj.type || "application/octet-stream" }));
      }
      const out = {}; for (const k of Object.keys(obj)) out[k] = deserialize(obj[k]); return out;
    }
    return obj;
  }

  // 备份稳定性参数：单文件较小时维持原 JSON 格式；大备份自动切成分片。
  // GitHub 单个文件保持在 Contents API 返回内容安全范围内，避免超大文件读取时 content 为空。
  const BACKUP_LOCAL_SPLIT_THRESHOLD_BYTES = 12 * 1024 * 1024;
  const BACKUP_LOCAL_PART_BYTES = 6 * 1024 * 1024;
  const BACKUP_GITHUB_SINGLE_THRESHOLD_BYTES = 450 * 1024;
  const BACKUP_GITHUB_PART_BYTES = 450 * 1024;
  const BACKUP_GITHUB_REQUEST_DELAY_MS = 900;
  const BACKUP_BUNDLE_VERSION = 3;

  function utf8ByteLength(text) {
    try { return new TextEncoder().encode(String(text || "")).length; }
    catch (_) { return unescape(encodeURIComponent(String(text || ""))).length; }
  }

  function splitTextByUtf8Bytes(text, maxBytes) {
    const source = String(text || "");
    if (!source) return [""];
    const limit = Math.max(1024, Number(maxBytes) || 1024);
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();
    const bytes = encoder.encode(source);
    if (bytes.length <= limit) return [source];
    const parts = [];
    let start = 0;
    while (start < bytes.length) {
      let end = Math.min(start + limit, bytes.length);
      if (end < bytes.length) {
        while (end > start && (bytes[end] & 0xC0) === 0x80) end--;
      }
      if (end <= start) throw new Error("备份分片失败：无法安全切分 UTF-8 数据");
      parts.push(decoder.decode(bytes.slice(start, end)));
      start = end;
    }
    return parts;
  }

  function makeBackupBundleId() {
    try {
      if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") return globalThis.crypto.randomUUID().replace(/-/g, "");
    } catch (_) {}
    return String(Date.now().toString(36) + Math.random().toString(36).slice(2, 12));
  }

  async function sha256Text(text) {
    try {
      const c = globalThis.crypto;
      if (!c || !c.subtle) return "";
      const data = new TextEncoder().encode(String(text || ""));
      const digest = await c.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, "0")).join("");
    } catch (_) { return ""; }
  }

  function legacyBackupFromJson(json) {

      secretsExcluded: true,
    });

  function parseBackupManifest(text) {
    let p;
    try { p = JSON.parse(String(text || "")); }
    catch (_) { return null; }
    if (!p || p.format !== "missy-phone-backup-bundle" || Number(p.version) !== BACKUP_BUNDLE_VERSION || p.type !== "manifest") return null;
    if (!Array.isArray(p.parts) || !p.parts.length) throw new Error("备份分卷清单无效或没有分卷");
    return p;
  }

  async function restoreBackup(payload) {
    const p = JSON.parse(String(payload || ""));
    if (p && p.format === "missy-phone-backup-bundle" && Number(p.version) === BACKUP_BUNDLE_VERSION && p.type === "manifest") {
      throw new Error("这是分卷备份清单，请同时选择全部分卷文件后再导入");
    }
    const json = p && p.chunked
      ? (Array.isArray(p.chunks) ? p.chunks.join("") : "")
      : (p && typeof p.data === "string" ? p.data : "{}");
    if (!json) throw new Error("备份内容为空");
    return deserialize(JSON.parse(json));
  }

  async function buildBackupBundle(json, partBytes, makePartName) {
    const parts = splitTextByUtf8Bytes(json, partBytes);
    const bundleId = makeBackupBundleId();
    const items = [];
    for (let i = 0; i < parts.length; i++) {
      const chunk = parts[i];
      items.push({
        index: i + 1,
        name: makePartName(bundleId, i + 1, parts.length),
        bytes: utf8ByteLength(chunk),
        sha256: await sha256Text(chunk),
      });
    }
    return {
      manifest: {
        format: "missy-phone-backup-bundle",
        version: BACKUP_BUNDLE_VERSION,
        type: "manifest",
        createdAt: now(),
        bundleId,
        encoding: "utf-8",
        payloadType: "serialized-state-json",
        totalBytes: utf8ByteLength(json),
        totalChars: String(json || "").length,
        payloadSha256: await sha256Text(json),
        partBytes: Number(partBytes),
        partCount: parts.length,
        parts: items,
      },
      parts,
    };
  }

  async function restoreBackupBundle(manifest, getPartText) {
    if (!manifest || manifest.type !== "manifest" || Number(manifest.version) !== BACKUP_BUNDLE_VERSION) throw new Error("备份分卷清单版本不受支持");
    if (!Array.isArray(manifest.parts) || !manifest.parts.length) throw new Error("备份分卷清单无效或没有分卷");
    if (Number(manifest.partCount) !== manifest.parts.length) throw new Error("分卷清单损坏：分卷数量不一致");
    const ordered = [...manifest.parts].sort((a, b) => Number(a.index) - Number(b.index));
    if (ordered.some((p, i) => Number(p.index) !== i + 1 || !p.name)) throw new Error("分卷清单损坏：分卷序号或文件名无效");
    let json = "";
    for (const part of ordered) {
      const actual = await getPartText(part.name);
      if (actual == null) throw new Error(`分卷不完整：缺少 ${part.name}`);
      if (part.bytes && utf8ByteLength(actual) !== Number(part.bytes)) throw new Error(`分卷校验失败：${part.name}`);
      if (part.sha256) {
        const hash = await sha256Text(actual);
        if (hash && hash !== part.sha256) throw new Error(`分卷校验失败：${part.name}`);
      }
      json += actual;
    }
    if (!json) throw new Error("备份内容为空");
    if (manifest.totalBytes && utf8ByteLength(json) !== Number(manifest.totalBytes)) throw new Error("备份校验失败：总大小不一致");
    if (manifest.payloadSha256) {
      const hash = await sha256Text(json);
      if (hash && hash !== manifest.payloadSha256) throw new Error("备份校验失败：总校验和不一致");
    }
    return deserialize(JSON.parse(json));
  }

  // 本地超大备份使用“单个 ZIP 文件 + 内部分片”的方式，避免一次导出几十个文件在 iOS/Android 上被浏览器拦截。
  // ZIP 只使用 STORE（不压缩），不依赖第三方库，兼容当前 JSON 备份和旧版分卷文件。
  function zipU16(view, offset, value) { view.setUint16(offset, value >>> 0, true); }
  function zipU32(view, offset, value) { view.setUint32(offset, value >>> 0, true); }
  function zipU16Read(view, offset) { return view.getUint16(offset, true); }
  function zipU32Read(view, offset) { return view.getUint32(offset, true); }

  let backupCrcTable = null;
  function backupCrc32(bytes) {
    if (!backupCrcTable) {
      backupCrcTable = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        backupCrcTable[n] = c >>> 0;
      }
    }
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) crc = backupCrcTable[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function createStoredZip(entries) {
    const enc = new TextEncoder();
    const localParts = [];
    const centralParts = [];
    let offset = 0;
    const safeEntries = Array.isArray(entries) ? entries : [];
    if (!safeEntries.length) throw new Error("无法创建空备份 ZIP");
    for (const entry of safeEntries) {
      const name = String(entry && entry.name || "").replace(/^\/+/, "");
      if (!name || name.includes("../") || name.startsWith("../")) throw new Error("备份 ZIP 文件名无效");
      const nameBytes = enc.encode(name);
      const data = typeof entry.data === "string" ? enc.encode(entry.data) : new Uint8Array(entry.data || []);
      if (nameBytes.length > 0xFFFF || data.length > 0xFFFFFFFF || offset > 0xFFFFFFFF) throw new Error("备份 ZIP 过大，无法创建标准 ZIP 分片");
      const crc = backupCrc32(data);

      const local = new Uint8Array(30 + nameBytes.length);
      const lv = new DataView(local.buffer);
      zipU32(lv, 0, 0x04034B50);
      zipU16(lv, 4, 20);
      zipU16(lv, 6, 0);
      zipU16(lv, 8, 0);
      zipU16(lv, 10, 0);
      zipU16(lv, 12, 0);
      zipU32(lv, 14, crc);
      zipU32(lv, 18, data.length);
      zipU32(lv, 22, data.length);
      zipU16(lv, 26, nameBytes.length);
      zipU16(lv, 28, 0);
      local.set(nameBytes, 30);
      localParts.push(local, data);

      const central = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(central.buffer);
      zipU32(cv, 0, 0x02014B50);
      zipU16(cv, 4, 20);
      zipU16(cv, 6, 20);
      zipU16(cv, 8, 0);
      zipU16(cv, 10, 0);
      zipU16(cv, 12, 0);
      zipU16(cv, 14, 0);
      zipU32(cv, 16, crc);
      zipU32(cv, 20, data.length);
      zipU32(cv, 24, data.length);
      zipU16(cv, 28, nameBytes.length);
      zipU16(cv, 30, 0);
      zipU16(cv, 32, 0);
      zipU16(cv, 34, 0);
      zipU16(cv, 36, 0);
      zipU32(cv, 38, 0);
      zipU32(cv, 42, offset);
      central.set(nameBytes, 46);
      centralParts.push(central, nameBytes.length ? new Uint8Array(0) : new Uint8Array(0));

      offset += local.length + data.length;
    }
    const centralSize = centralParts.reduce((sum, x) => sum + x.length, 0);
    const entryCount = safeEntries.length;
    if (centralSize > 0xFFFFFFFF || offset > 0xFFFFFFFF) throw new Error("备份 ZIP 超过标准 ZIP 4GB 限制");
    const eocd = new Uint8Array(22);
    const ev = new DataView(eocd.buffer);
    zipU32(ev, 0, 0x06054B50);
    zipU16(ev, 4, 0);
    zipU16(ev, 6, 0);
    zipU16(ev, 8, entryCount);
    zipU16(ev, 10, entryCount);
    zipU32(ev, 12, centralSize);
    zipU32(ev, 16, offset);
    zipU16(ev, 20, 0);
    return new Blob([...localParts, ...centralParts, eocd], { type: "application/zip" });
  }

  async function readStoredZip(blob) {
    const bytes = new Uint8Array(await blob.arrayBuffer());
    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const dec = new TextDecoder();
    const entries = new Map();
    let offset = 0;
    while (offset + 30 <= bytes.length && zipU32Read(view, offset) === 0x04034B50) {
      const flags = zipU16Read(view, offset + 6);
      const method = zipU16Read(view, offset + 8);
      const compressedSize = zipU32Read(view, offset + 18);
      const nameLen = zipU16Read(view, offset + 26);
      const extraLen = zipU16Read(view, offset + 28);
      if (flags & 0x08) throw new Error("备份 ZIP 使用了不支持的数据描述符格式");
      if (method !== 0) throw new Error("备份 ZIP 使用了不支持的压缩格式");
      const nameStart = offset + 30;
      const dataStart = nameStart + nameLen + extraLen;
      const dataEnd = dataStart + compressedSize;
      if (dataEnd > bytes.length) throw new Error("备份 ZIP 数据不完整");
      const name = dec.decode(bytes.slice(nameStart, nameStart + nameLen));
      if (!name || name.includes("../") || name.startsWith("../")) throw new Error("备份 ZIP 文件名无效");
      const text = dec.decode(bytes.slice(dataStart, dataEnd));
      entries.set(name, text);
      offset = dataEnd;
    }
    if (!entries.size) throw new Error("备份 ZIP 中没有有效分片");
    return entries;
  }

  function mergeBackupState(restored) {
    const def = defaultState();
    const merged = deepMerge(def, restored);
    merged.desktop = deepMerge(def.desktop, restored.desktop || {});
    merged.desktop.widgets = deepMerge(def.desktop.widgets, (restored.desktop && restored.desktop.widgets) || {});
    merged.profile = deepMerge(def.profile, restored.profile || {});
    merged.chat = deepMerge(def.chat, restored.chat || {});
    merged.memory = deepMerge(def.memory, restored.memory || {});
    merged.settings = deepMerge(def.settings, restored.settings || {});
    preserveLocalSecrets(merged, store.state);
    replaceReactiveState(store.state, merged);
    updateWorldbookPersistenceBaseline();

    persist();

  let localBackupInFlight = false;

  function triggerTextDownload(filename, text, delayMs = 0) {
    return new Promise((resolve, reject) => {
      const run = () => {
        try {
          const blob = new Blob([String(text || "")], { type: "application/json;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          a.rel = "noopener";
          a.style.display = "none";
          document.body.appendChild(a);
          a.click();
          setTimeout(() => { try { a.remove(); } catch (_) {} try { URL.revokeObjectURL(url); } catch (_) {} }, 15000);
          resolve();
        } catch (e) { reject(e); }
      };
      if (delayMs > 0) setTimeout(run, delayMs); else run();
    });
  }

  function triggerBlobDownload(filename, blob, mime = "application/octet-stream") {
    return new Promise((resolve, reject) => {
      try {
        const out = blob instanceof Blob ? blob : new Blob([blob], { type: mime });
        const url = URL.createObjectURL(out);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.rel = "noopener";
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { try { a.remove(); } catch (_) {} try { URL.revokeObjectURL(url); } catch (_) {} }, 20000);
        resolve();
      } catch (e) { reject(e); }
    });
  }

  async function exportLocal() {
    if (localBackupInFlight) { toast("备份正在导出，请稍候"); return; }
    localBackupInFlight = true;
    try {
      const json = await buildBackupJson();
      const rawBytes = utf8ByteLength(json);
      const stamp = fmtDate(now());
      if (rawBytes <= BACKUP_LOCAL_SPLIT_THRESHOLD_BYTES) {
        await triggerTextDownload("missy-backup-" + stamp + ".json", legacyBackupFromJson(json), 0);
        backupAlert("本地备份已经成功导出。备份文件不包含 API Key / GitHub Token。", "本地备份导出成功");
        return;
      }

      const bundle = await buildBackupBundle(
        json,
        BACKUP_LOCAL_PART_BYTES,
        (bundleId, index, total) => `parts/${bundleId}-part-${String(index).padStart(4, "0")}-of-${String(total).padStart(4, "0")}.part`
      );
      const zipEntries = [
        { name: "manifest.json", data: JSON.stringify(bundle.manifest) },
        ...bundle.parts.map((part, i) => ({ name: bundle.manifest.parts[i].name, data: part })),
      ];
      const zip = createStoredZip(zipEntries);
      await triggerBlobDownload(`missy-backup-${stamp}-${bundle.manifest.bundleId}-parts.zip`, zip, "application/zip");
      backupAlert(`本地大备份已经成功导出。已打包为 1 个 ZIP，内部包含 ${bundle.parts.length} 个分片。`, "本地备份导出成功");
    } catch (e) {
      backupAlert("本地备份导出失败：" + (e && e.message ? e.message : "文件生成失败或浏览器拒绝保存"), "本地备份导出失败");
    } finally {
      localBackupInFlight = false;
    }
  }

  async function importLocalFiles(fileList) {
    const files = Array.from(fileList || []).filter(Boolean);
    if (!files.length) throw new Error("未选择备份文件");

    const zipFiles = [];
    for (const f of files) {
      let isZip = /\.zip$/i.test(String(f.name || ""));
      if (!isZip) {
        try {
          const head = new Uint8Array(await f.slice(0, 4).arrayBuffer());
          isZip = head.length === 4 && head[0] === 0x50 && head[1] === 0x4B && head[2] === 0x03 && head[3] === 0x04;
        } catch (_) {}
      }
      if (isZip) zipFiles.push(f);
    }
    if (zipFiles.length) {
      if (files.length !== 1 || zipFiles.length !== 1) throw new Error("大备份 ZIP 请单独选择，不要与其他分卷混选");
      const entries = await readStoredZip(zipFiles[0]);
      const manifestText = entries.get("manifest.json");
      const manifest = parseBackupManifest(manifestText);
      if (!manifest) throw new Error("ZIP 中没有有效的 Missy 备份清单");
      const restored = await restoreBackupBundle(manifest, async (name) => entries.get(name));
      mergeBackupState(restored);
      return;
    }

    const texts = await Promise.all(files.map((f) => f.text()));
    let manifest = null;
    for (const text of texts) {
      const parsed = parseBackupManifest(text);
      if (parsed) { manifest = parsed; break; }
    }

    if (manifest) {
      const byName = new Map(files.map((f, i) => [f.name, texts[i]]));
      const restored = await restoreBackupBundle(manifest, async (name) => byName.get(name));
      mergeBackupState(restored);
      return;
    }

    if (files.length === 1) {
      const restored = await restoreBackup(texts[0]);
      mergeBackupState(restored);
      return;
    }

    const partMatches = files.map((f, i) => {
      const m = String(f.name || "").match(/-part-(\d+)-of-(\d+)\.part$/i);
      return m ? { file: f, text: texts[i], index: Number(m[1]), total: Number(m[2]) } : null;
    }).filter(Boolean);
    if (!partMatches.length) throw new Error("未找到有效的备份清单或分卷文件");
    const total = partMatches[0].total;
    if (partMatches.length !== total || partMatches.some((p) => p.total !== total)) throw new Error(`分卷不完整：需要 ${total} 个分卷，当前选择了 ${partMatches.length} 个`);
    partMatches.sort((a, b) => a.index - b.index);
    if (partMatches.some((p, i) => p.index !== i + 1)) throw new Error("分卷序号不连续，请选择同一组完整备份分卷");
    const json = partMatches.map((p) => p.text).join("");
    const restored = deserialize(JSON.parse(json));
    mergeBackupState(restored);
  }
